<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Tools</title>
		<meta name="description" content="Matt Palmer's tools." />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8e6e4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0d0c" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Tools" />
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			try{var t=localStorage.getItem("tools-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
