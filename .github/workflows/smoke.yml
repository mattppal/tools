name: smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: https://tools.mattpalmer.io or a https://<branch>-tools.mpal.workers.dev preview
        required: true
        default: https://tools.mattpalmer.io
      sha:
        description: Commit the target must serve (optional)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: smoke-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Smoke the live app as tools-agent-verify
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TARGET: ${{ inputs.target || 'https://tools.mattpalmer.io' }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$SHA" ]; then bun run smoke --target "$TARGET" --sha "$SHA" --wait 300; else bun run smoke --target "$TARGET"; fi
