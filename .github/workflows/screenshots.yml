name: screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: https://tools.mattpalmer.io or a https://<branch>-tools.mpal.workers.dev preview
        required: true
        default: https://tools.mattpalmer.io
      only:
        description: Take only the screenshots whose file name contains this (optional)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: screenshots-${{ inputs.target || 'production' }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Inter, the font the app asks for first
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-inter
          fc-match Inter | grep -q Inter
      - name: Screenshot the live app as tools-agent-verify
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target || 'https://tools.mattpalmer.io' }}
          ONLY: ${{ inputs.only }}
          SHA: ${{ github.sha }}
        run: |
          args=(--target "$TARGET" --out screenshots)
          if [ "$EVENT" = "push" ]; then args+=(--sha "$SHA" --wait 600); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          bun run screenshots "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
